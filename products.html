<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Products – ZentroMall</title>
    <link rel="icon" href="logo.png">

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        html {
            scroll-behavior: smooth;
        }

        body {
            background: linear-gradient(135deg, #14002c, #1b1464, #050505);
        }

        .glass {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(18px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .nav-link {
            transition: .3s;
        }

        .nav-link:hover {
            color: #facc15;
        }
    </style>
</head>

<body class="text-white min-h-screen flex flex-col justify-between">

    <!-- Top Banner (Optional dynamic announcements) -->
    <div id="topBanner" class="hidden bg-yellow-400 text-black py-2 overflow-hidden whitespace-nowrap shadow-md">
        <div id="bannerContainer" class="inline-block animate-marquee"></div>
    </div>

    <!-- Navigation Bar -->
    <nav class="sticky top-0 z-50 glass">
        <div class="max-w-7xl mx-auto px-6 py-4">
            <div class="flex justify-between items-center">
                
                <!-- Logo -->
                <a href="index.html" class="flex items-center gap-4">
                    <img src="logo.png" class="h-12 w-12 rounded-full shadow-2xl object-cover" onerror="this.src='https://via.placeholder.com/100/4f46e5/ffffff?text=ZM'">
                    <div>
                        <h1 class="text-2xl md:text-3xl font-black tracking-wide">ZentroMall</h1>
                        <p class="text-xs text-gray-300 hidden sm:block">Premium Shopping Experience</p>
                    </div>
                </a>

                <!-- Desktop Menu Nav -->
                <div class="hidden lg:flex gap-6 items-center font-medium">
                    <a href="index.html" class="nav-link">Home</a>
                    <a href="products.html" class="nav-link text-yellow-400 font-bold">Products</a>
                    <a href="wishlist.html" class="nav-link">
                        Wishlist (<span class="wishlist-badge">0</span>)
                    </a>
                    <a href="cart.html" class="nav-link">
                        Cart (<span class="cart-badge">0</span>)
                    </a>
                    <a href="my-orders.html" class="nav-link">Orders</a>
                    
                    <!-- Dynamic Auth Links Slot -->
                    <div id="navAuthLinks" class="flex items-center gap-4">
                        <a href="login.html" class="bg-yellow-400 hover:bg-yellow-300 text-black px-5 py-2 rounded-xl font-bold transition">Login</a>
                    </div>

                    <a href="admin.html" class="bg-indigo-600 hover:bg-indigo-500 px-5 py-2 rounded-xl font-bold transition">Admin</a>
                </div>

                <!-- Mobile Menu Toggle Button -->
                <button id="mobileBtn" onclick="toggleMobileMenu()" class="lg:hidden text-3xl focus:outline-none">
                    <i class="fa-solid fa-bars"></i>
                </button>
            </div>

            <!-- Mobile Drawer Menu -->
            <div id="mobileMenu" class="hidden pt-4 pb-2 space-y-3 lg:hidden border-t border-white/10 mt-3">
                <a href="index.html" class="block py-1 hover:text-yellow-400">Home</a>
                <a href="products.html" class="block py-1 hover:text-yellow-400 text-yellow-400 font-bold">Products</a>
                <a href="wishlist.html" class="block py-1 hover:text-yellow-400">Wishlist (<span class="wishlist-badge">0</span>)</a>
                <a href="cart.html" class="block py-1 hover:text-yellow-400">Cart (<span class="cart-badge">0</span>)</a>
                <a href="my-orders.html" class="block py-1 hover:text-yellow-400">My Orders</a>
                <a href="profile.html" class="block py-1 hover:text-yellow-400">Profile</a>
                <div class="flex gap-4 pt-2">
                    <a href="login.html" class="bg-yellow-400 text-black px-4 py-2 rounded-lg font-bold text-sm w-full text-center">Login</a>
                    <a href="admin.html" class="bg-indigo-600 text-white px-4 py-2 rounded-lg font-bold text-sm w-full text-center">Admin</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Container -->
    <main class="max-w-7xl mx-auto px-6 py-10 flex-grow w-full">
        <h1 class="text-4xl md:text-6xl font-black text-center mb-8 bg-clip-text text-transparent bg-gradient-to-r from-yellow-400 via-orange-400 to-pink-500">
            Explore All Products
        </h1>

        <!-- Search & Advanced Filter Controls -->
        <div class="glass rounded-3xl p-6 md:p-8 shadow-2xl mb-12">
            <!-- Search Input -->
            <div class="relative mb-6">
                <input type="text" id="search" placeholder="Search by product name, details, SKU..." 
                       class="w-full py-4 pl-12 pr-4 rounded-2xl bg-white/10 border border-white/20 text-white placeholder-gray-400 text-lg focus:outline-none focus:border-yellow-400 transition">
                <i class="fa-solid fa-magnifying-glass absolute left-4 top-5 text-gray-400 text-xl"></i>
            </div>

            <!-- Filter Controls Grid -->
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                <!-- Category Select -->
                <select id="category" onchange="applyFilters()" class="py-3 px-4 rounded-xl bg-slate-900 border border-white/20 text-white focus:outline-none focus:border-yellow-400">
                    <option value="">All Categories</option>
                    <option value="Mobiles">Mobiles</option>
                    <option value="Laptops">Laptops</option>
                    <option value="Electronics">Electronics</option>
                    <option value="Fashion">Fashion</option>
                    <option value="Accessories">Accessories</option>
                    <option value="Watches">Watches</option>
                </select>

                <!-- Min Price -->
                <input type="number" id="minprice" placeholder="Min Price (PKR)" oninput="applyFilters()"
                       class="py-3 px-4 rounded-xl bg-white/10 border border-white/20 text-white placeholder-gray-400 focus:outline-none focus:border-yellow-400">

                <!-- Max Price -->
                <input type="number" id="maxprice" placeholder="Max Price (PKR)" oninput="applyFilters()"
                       class="py-3 px-4 rounded-xl bg-white/10 border border-white/20 text-white placeholder-gray-400 focus:outline-none focus:border-yellow-400">

                <!-- Sort Options -->
                <select id="sort" onchange="applyFilters()" class="py-3 px-4 rounded-xl bg-slate-900 border border-white/20 text-white focus:outline-none focus:border-yellow-400">
                    <option value="">Sort By</option>
                    <option value="low">Price: Low to High</option>
                    <option value="high">Price: High to Low</option>
                    <option value="new">Newest First</option>
                </select>
            </div>

            <div class="mt-6 flex justify-between items-center">
                <button onclick="resetFilters()" class="text-xs text-gray-400 hover:text-white underline">Reset Filters</button>
                <button onclick="applyFilters()" class="bg-gradient-to-r from-yellow-400 to-amber-500 hover:brightness-110 text-black py-3 px-8 rounded-xl text-base font-bold transition shadow-lg w-full sm:w-auto">
                    <i class="fa-solid fa-filter mr-2"></i> Apply Filters
                </button>
            </div>
        </div>

        <!-- Products Grid Slot -->
        <div id="product-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-8">
            <!-- Dynamic items rendered via JavaScript -->
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-black/60 border-t border-white/10 pt-10 pb-8 mt-16">
        <div class="max-w-7xl mx-auto px-6 text-center text-xs text-gray-500">
            &copy; 2026 ZentroMall. All rights reserved.
        </div>
    </footer>

    <!-- Main Engine -->
    <script src="main.js"></script>

    <!-- Page Specific Script -->
    <script>
        function toggleMobileMenu() {
            const menu = document.getElementById('mobileMenu');
            menu.classList.toggle('hidden');
        }

        // Custom Wishlist sync triggers applyFilters to refresh red heart state
        function renderWishlist() {
            applyFilters();
        }

        function renderProducts() {
            applyFilters();
        }

        function renderProductsList(list = products) {
            const grid = document.getElementById("product-grid");
            if (!grid) return;

            if (!list || list.length === 0) {
                grid.innerHTML = `
                    <div class="col-span-full text-center py-20 glass rounded-3xl">
                        <i class="fa-solid fa-box-open text-6xl text-gray-500 mb-4"></i>
                        <p class="text-2xl font-bold text-gray-400">No products found matching your criteria.</p>
                    </div>`;
                return;
            }

            grid.innerHTML = list.map(p => {
                const isWishlisted = wishlist.includes(p.id);
                const isVideo = p.image?.startsWith("data:video") || p.image?.endsWith(".mp4") || p.image?.endsWith(".webm");
                const outOfStock = p.stock !== undefined && p.stock < 1;

                return `
                    <div class="glass border border-white/10 rounded-3xl overflow-hidden shadow-2xl hover:-translate-y-2 transition duration-300 flex flex-col justify-between group">
                        <div class="relative overflow-hidden">
                            ${
                                isVideo
                                ? `<video src="${p.image}" class="w-full h-60 object-cover" controls loop muted></video>`
                                : `<img src="${p.image || 'https://via.placeholder.com/400'}" alt="${p.name}" class="w-full h-60 object-cover group-hover:scale-105 transition duration-500" onerror="this.src='https://via.placeholder.com/400/333/fff?text=No+Image'">`
                            }
                            <button onclick="toggleWishlist(${p.id})" class="absolute top-3 right-3 p-2.5 glass rounded-full shadow-lg hover:bg-white/20 transition z-10" aria-label="Wishlist">
                                <i class="fa-solid fa-heart ${isWishlisted ? 'text-red-500' : 'text-gray-300'} text-lg"></i>
                            </button>
                            ${outOfStock ? `<span class="absolute top-3 left-3 bg-rose-600 text-white text-[10px] font-bold px-2 py-1 rounded-lg">OUT OF STOCK</span>` : ""}
                            ${p.sku ? `<span class="absolute bottom-3 left-3 bg-black/60 text-white text-[10px] font-mono px-2 py-0.5 rounded">${p.sku}</span>` : ""}
                        </div>

                        <div class="p-6 flex-1 flex flex-col justify-between">
                            <div>
                                <span class="text-xs text-yellow-400 font-bold uppercase tracking-wider">${p.category || 'General'}</span>
                                <h3 class="text-lg font-bold text-white mt-1 hover:text-yellow-300 cursor-pointer line-clamp-1" onclick="window.location.href='product-detail.html?id=${p.id}'">${p.name}</h3>
                                <p class="text-gray-300 text-xs mt-1.5 line-clamp-2">${p.desc || ""}</p>
                                ${p.rating ? `<div class="flex items-center gap-1 mt-2 text-yellow-400 text-xs"><i class="fa-solid fa-star"></i> ${p.rating}</div>` : ""}
                            </div>

                            <div class="mt-6 pt-4 border-t border-white/10 flex items-center justify-between">
                                <div>
                                    <p class="text-[10px] uppercase text-gray-400">Price</p>
                                    <p class="text-lg font-black text-yellow-400">${formatPrice(p.price)}</p>
                                </div>
                                <button onclick="addToCart(${p.id})" ${outOfStock ? 'disabled' : ''} class="bg-gradient-to-r from-yellow-400 to-amber-500 text-black px-4 py-2 rounded-xl text-xs font-bold hover:brightness-110 transition shadow-md flex items-center gap-1.5 disabled:opacity-50 disabled:cursor-not-allowed">
                                    <i class="fa-solid fa-cart-plus"></i> Add
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            }).join("");
        }

        // Live Search Input
        document.getElementById("search").addEventListener("input", applyFilters);

        function applyFilters() {
            let filtered = [...products];
            const term = document.getElementById("search").value.toLowerCase().trim();
            const category = document.getElementById("category").value;
            const min = parseInt(document.getElementById("minprice").value) || 0;
            const max = parseInt(document.getElementById("maxprice").value) || Infinity;
            const sort = document.getElementById("sort").value;

            if (term) {
                filtered = filtered.filter(p => 
                    (p.name && p.name.toLowerCase().includes(term)) || 
                    (p.desc && p.desc.toLowerCase().includes(term)) ||
                    (p.sku && p.sku.toLowerCase().includes(term))
                );
            }

            if (category) {
                filtered = filtered.filter(p => (p.category || "").toLowerCase() === category.toLowerCase());
            }

            filtered = filtered.filter(p => p.price >= min && p.price <= max);

            if (sort === "low") filtered.sort((a, b) => a.price - b.price);
            if (sort === "high") filtered.sort((a, b) => b.price - a.price);
            if (sort === "new") filtered.sort((a, b) => b.id - a.id);

            renderProductsList(filtered);
        }

        function resetFilters() {
            document.getElementById("search").value = "";
            document.getElementById("category").value = "";
            document.getElementById("minprice").value = "";
            document.getElementById("maxprice").value = "";
            document.getElementById("sort").value = "";
            applyFilters();
        }

        // Initial setup on DOM ready
        document.addEventListener("DOMContentLoaded", () => {
            // URL Category Param Check
            const urlParams = new URLSearchParams(window.location.search);
            const categoryParam = urlParams.get('category');
            
            if (categoryParam) {
                const categorySelect = document.getElementById("category");
                if (categorySelect) {
                    const matchOption = Array.from(categorySelect.options).find(
                        opt => opt.value.toLowerCase() === categoryParam.toLowerCase()
                    );
                    if (matchOption) {
                        categorySelect.value = matchOption.value;
                    }
                }
            }

            applyFilters();
        });
    </script>
</body>

</html>
