<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile – ZentroMall</title>
    <link rel="icon" href="logo.png">

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        html {
            scroll-behavior: smooth;
        }

        body {
            background: linear-gradient(135deg, #14002c, #1b1464, #050505);
        }

        .glass {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(18px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .nav-link {
            transition: .3s;
        }

        .nav-link:hover {
            color: #facc15;
        }
    </style>
</head>

<body class="text-white min-h-screen flex flex-col justify-between">

    <!-- Navigation Bar -->
    <nav class="sticky top-0 z-50 glass">
        <div class="max-w-7xl mx-auto px-6 py-4">
            <div class="flex justify-between items-center">
                
                <!-- Logo -->
                <a href="index.html" class="flex items-center gap-4">
                    <img src="logo.png" class="h-12 w-12 rounded-full shadow-2xl object-cover" onerror="this.src='https://via.placeholder.com/100/4f46e5/ffffff?text=ZM'">
                    <div>
                        <h1 class="text-2xl md:text-3xl font-black tracking-wide">ZentroMall</h1>
                        <p class="text-xs text-gray-300 hidden sm:block">Premium Shopping Experience</p>
                    </div>
                </a>

                <!-- Desktop Menu Nav -->
                <div class="hidden lg:flex gap-6 items-center font-medium">
                    <a href="index.html" class="nav-link">Home</a>
                    <a href="products.html" class="nav-link">Products</a>
                    <a href="wishlist.html" class="nav-link">
                        Wishlist (<span id="wishlist-count" class="wishlist-badge">0</span>)
                    </a>
                    <a href="cart.html" class="nav-link">
                        Cart (<span id="cart-count" class="cart-badge">0</span>)
                    </a>
                    <a href="my-orders.html" class="nav-link">Orders</a>
                    <a href="profile.html" class="nav-link text-yellow-400">Profile</a>
                    <button onclick="logout()" class="bg-rose-600 hover:bg-rose-700 text-white px-5 py-2 rounded-xl font-bold transition">Logout</button>
                    <a href="admin.html" class="bg-indigo-600 hover:bg-indigo-500 px-5 py-2 rounded-xl font-bold transition">Admin</a>
                </div>

                <!-- Mobile Menu Toggle Button -->
                <button id="mobileBtn" onclick="toggleMobileMenu()" class="lg:hidden text-3xl focus:outline-none">
                    <i class="fa-solid fa-bars"></i>
                </button>
            </div>

            <!-- Mobile Drawer Menu -->
            <div id="mobileMenu" class="hidden pt-4 pb-2 space-y-3 lg:hidden border-t border-white/10 mt-3">
                <a href="index.html" class="block py-1 hover:text-yellow-400">Home</a>
                <a href="products.html" class="block py-1 hover:text-yellow-400">Products</a>
                <a href="wishlist.html" class="block py-1 hover:text-yellow-400">Wishlist (<span class="wishlist-badge">0</span>)</a>
                <a href="cart.html" class="block py-1 hover:text-yellow-400">Cart (<span class="cart-badge">0</span>)</a>
                <a href="my-orders.html" class="block py-1 hover:text-yellow-400">My Orders</a>
                <a href="profile.html" class="block py-1 text-yellow-400">Profile</a>
                <div class="flex gap-4 pt-2">
                    <button onclick="logout()" class="bg-rose-600 text-white px-4 py-2 rounded-lg font-bold text-sm w-full text-center">Logout</button>
                    <a href="admin.html" class="bg-indigo-600 text-white px-4 py-2 rounded-lg font-bold text-sm w-full text-center">Admin</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Profile Section -->
    <main class="max-w-2xl mx-auto px-6 py-12 flex-grow w-full">
        <h1 class="text-4xl md:text-6xl font-black text-center mb-8 bg-clip-text text-transparent bg-gradient-to-r from-yellow-400 via-orange-400 to-pink-500">
            Account Profile
        </h1>

        <div class="glass p-8 md:p-10 rounded-3xl shadow-2xl space-y-8">
            <div class="flex items-center gap-6 border-b border-white/10 pb-6">
                <div class="w-20 h-20 bg-gradient-to-tr from-yellow-400 to-amber-600 rounded-full flex items-center justify-center text-3xl font-black text-black shadow-lg">
                    <i class="fa-solid fa-user"></i>
                </div>
                <div>
                    <h2 id="user-name" class="text-2xl md:text-3xl font-black text-white">---</h2>
                    <p class="text-xs text-yellow-400 font-bold uppercase tracking-widest mt-1">Valued Member</p>
                </div>
            </div>

            <!-- User Information Details -->
            <div id="profile-details" class="space-y-4 text-sm md:text-base"></div>

            <div class="pt-4 flex flex-col sm:flex-row gap-4 border-t border-white/10">
                <button onclick="updateProfile()" 
                        class="flex-1 bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 text-white py-3.5 px-6 rounded-xl font-bold transition shadow-lg flex items-center justify-center gap-2">
                    <i class="fa-solid fa-pen-to-square"></i> Update Phone Number
                </button>
                <button onclick="logout()" 
                        class="bg-rose-600/20 border border-rose-500/40 hover:bg-rose-600 text-rose-300 hover:text-white py-3.5 px-6 rounded-xl font-bold transition flex items-center justify-center gap-2">
                    <i class="fa-solid fa-right-from-bracket"></i> Logout
                </button>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-black/60 border-t border-white/10 pt-10 pb-8 mt-16">
        <div class="max-w-7xl mx-auto px-6 text-center text-xs text-gray-500">
            &copy; 2026 ZentroMall. All rights reserved.
        </div>
    </footer>

    <!-- Main Logic Script -->
    <script src="main.js"></script>

    <!-- Profile Page Specific Script -->
    <script>
        function toggleMobileMenu() {
            const menu = document.getElementById('mobileMenu');
            menu.classList.toggle('hidden');
        }

        function initProfile() {
            if (!currentUser) {
                window.location.href = "login.html";
                return;
            }

            document.getElementById("user-name").textContent = currentUser.name || "User";

            const profileDiv = document.getElementById("profile-details");
            profileDiv.innerHTML = `
                <div class="flex items-center justify-between p-4 bg-white/5 rounded-2xl border border-white/5">
                    <span class="text-gray-400 font-medium">Full Name</span>
                    <span class="font-bold text-white">${currentUser.name || 'N/A'}</span>
                </div>
                <div class="flex items-center justify-between p-4 bg-white/5 rounded-2xl border border-white/5">
                    <span class="text-gray-400 font-medium">Email Address</span>
                    <span class="font-bold text-white">${currentUser.email || 'N/A'}</span>
                </div>
                <div class="flex items-center justify-between p-4 bg-white/5 rounded-2xl border border-white/5">
                    <span class="text-gray-400 font-medium">Phone Number</span>
                    <span class="font-bold text-emerald-400">${currentUser.phone || "Not set"}</span>
                </div>
            `;

            updateBadges();
        }

        function updateProfile() {
            const newPhone = prompt("Enter your new phone number:", currentUser.phone || "");
            if (newPhone !== null && newPhone.trim() !== "") {
                currentUser.phone = newPhone.trim();

                const users = JSON.parse(localStorage.getItem("zm_users") || "[]");
                const index = users.findIndex(u => u.email === currentUser.email);
                if (index !== -1) {
                    users[index] = currentUser;
                }

                localStorage.setItem("zm_users", JSON.stringify(users));
                localStorage.setItem("zm_user", JSON.stringify(currentUser));

                alert("✅ Profile updated successfully!");
                initProfile();
            }
        }

        function logout() {
            if (confirm("Are you sure you want to logout?")) {
                currentUser = null;
                localStorage.removeItem("zm_user");
                window.location.href = "index.html";
            }
        }

        document.addEventListener("DOMContentLoaded", initProfile);
    </script>
</body>

</html>
