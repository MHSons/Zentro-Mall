<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order History – ZentroMall</title>
    <link rel="icon" href="logo.png">

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        html {
            scroll-behavior: smooth;
        }

        body {
            background: linear-gradient(135deg, #14002c, #1b1464, #050505);
        }

        .glass {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(18px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .nav-link {
            transition: .3s;
        }

        .nav-link:hover {
            color: #facc15;
        }
    </style>
</head>

<body class="text-white min-h-screen flex flex-col justify-between">

    <!-- Navigation Bar -->
    <nav class="sticky top-0 z-50 glass">
        <div class="max-w-7xl mx-auto px-6 py-4">
            <div class="flex justify-between items-center">
                
                <!-- Logo -->
                <a href="index.html" class="flex items-center gap-4">
                    <img src="logo.png" class="h-12 w-12 rounded-full shadow-2xl object-cover" onerror="this.src='https://via.placeholder.com/100/4f46e5/ffffff?text=ZM'">
                    <div>
                        <h1 class="text-2xl md:text-3xl font-black tracking-wide">ZentroMall</h1>
                        <p class="text-xs text-gray-300 hidden sm:block">Premium Shopping Experience</p>
                    </div>
                </a>

                <!-- Desktop Menu Nav -->
                <div class="hidden lg:flex gap-6 items-center font-medium">
                    <a href="index.html" class="nav-link">Home</a>
                    <a href="products.html" class="nav-link">Products</a>
                    <a href="wishlist.html" class="nav-link">
                        Wishlist (<span id="wishlist-count" class="wishlist-badge">0</span>)
                    </a>
                    <a href="cart.html" class="nav-link">
                        Cart (<span id="cart-count" class="cart-badge">0</span>)
                    </a>
                    <a href="my-orders.html" class="nav-link text-yellow-400">Orders</a>
                    <a href="profile.html" class="nav-link">Profile</a>
                    <a href="login.html" class="bg-yellow-400 hover:bg-yellow-300 text-black px-5 py-2 rounded-xl font-bold transition">Login</a>
                    <a href="admin.html" class="bg-indigo-600 hover:bg-indigo-500 px-5 py-2 rounded-xl font-bold transition">Admin</a>
                </div>

                <!-- Mobile Menu Toggle Button -->
                <button id="mobileBtn" onclick="toggleMobileMenu()" class="lg:hidden text-3xl focus:outline-none">
                    <i class="fa-solid fa-bars"></i>
                </button>
            </div>

            <!-- Mobile Drawer Menu -->
            <div id="mobileMenu" class="hidden pt-4 pb-2 space-y-3 lg:hidden border-t border-white/10 mt-3">
                <a href="index.html" class="block py-1 hover:text-yellow-400">Home</a>
                <a href="products.html" class="block py-1 hover:text-yellow-400">Products</a>
                <a href="wishlist.html" class="block py-1 hover:text-yellow-400">Wishlist (<span class="wishlist-badge">0</span>)</a>
                <a href="cart.html" class="block py-1 hover:text-yellow-400">Cart (<span class="cart-badge">0</span>)</a>
                <a href="my-orders.html" class="block py-1 text-yellow-400">My Orders</a>
                <a href="profile.html" class="block py-1 hover:text-yellow-400">Profile</a>
                <div class="flex gap-4 pt-2">
                    <a href="login.html" class="bg-yellow-400 text-black px-4 py-2 rounded-lg font-bold text-sm w-full text-center">Login</a>
                    <a href="admin.html" class="bg-indigo-600 text-white px-4 py-2 rounded-lg font-bold text-sm w-full text-center">Admin</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Orders History Section -->
    <main class="max-w-4xl mx-auto px-6 py-12 flex-grow w-full">
        <h1 class="text-4xl md:text-6xl font-black text-center mb-4 bg-clip-text text-transparent bg-gradient-to-r from-yellow-400 via-orange-400 to-pink-500">
            Track Your Orders
        </h1>
        <p class="text-center text-gray-300 mb-10 text-sm md:text-base">Enter your phone number to check current and previous order status</p>

        <!-- Phone Filter Card -->
        <div class="glass p-8 rounded-3xl mb-12 shadow-2xl">
            <div class="flex flex-col sm:flex-row gap-4">
                <div class="relative flex-1">
                    <i class="fa-solid fa-phone absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"></i>
                    <input type="tel" id="phoneInput" placeholder="e.g. 03001234567" 
                           class="w-full py-3.5 pl-12 pr-4 rounded-xl bg-white/10 border border-white/20 text-white placeholder-gray-400 focus:outline-none focus:border-yellow-400 font-bold tracking-wider">
                </div>
                <button onclick="checkOrders()" 
                        class="bg-gradient-to-r from-yellow-400 to-amber-500 hover:from-yellow-300 hover:to-amber-400 text-black px-8 py-3.5 rounded-xl font-bold transition shadow-lg flex items-center justify-center gap-2">
                    <i class="fa-solid fa-magnifying-glass"></i> Search Orders
                </button>
            </div>
        </div>

        <!-- Orders Result List -->
        <div id="orderList" class="space-y-6"></div>
    </main>

    <!-- Footer -->
    <footer class="bg-black/60 border-t border-white/10 pt-10 pb-8 mt-16">
        <div class="max-w-7xl mx-auto px-6 text-center text-xs text-gray-500">
            &copy; 2026 ZentroMall. All rights reserved.
        </div>
    </footer>

    <!-- Main Logic Script -->
    <script src="main.js"></script>

    <!-- Order Page Specific Script -->
    <script>
        function toggleMobileMenu() {
            const menu = document.getElementById('mobileMenu');
            menu.classList.toggle('hidden');
        }

        function checkOrders() {
            const rawPhone = document.getElementById("phoneInput").value.trim();
            const phone = rawPhone.replace(/\D/g, '');

            if (!phone || phone.length < 8) {
                alert("⚠️ Please enter a valid phone number!");
                return;
            }

            const container = document.getElementById("orderList");

            const userOrders = (orders || [])
                .filter(o => o.customer && o.customer.phone && o.customer.phone.replace(/\D/g, '').includes(phone))
                .sort((a, b) => new Date(b.date) - new Date(a.date));

            if (userOrders.length === 0) {
                container.innerHTML = `
                    <div class="glass p-12 rounded-3xl text-center space-y-4">
                        <i class="fa-solid fa-box-open text-6xl text-gray-500 mb-2"></i>
                        <h3 class="text-2xl font-bold text-gray-300">No Orders Found</h3>
                        <p class="text-gray-400 text-sm">We couldn't find any orders matching <strong>${rawPhone}</strong>.</p>
                        <a href="products.html" class="inline-block mt-4 bg-yellow-400 text-black font-bold px-8 py-3 rounded-xl hover:bg-yellow-300 transition">
                            Start Shopping
                        </a>
                    </div>`;
                return;
            }

            container.innerHTML = userOrders.map((o, idx) => {
                const itemsList = (o.items || []).map(it => {
                    const product = products.find(p => p.id === it.id);
                    const itemTotal = product ? product.price * it.qty : 0;
                    return `
                        <div class="flex justify-between items-center text-sm py-1 border-b border-white/5">
                            <span class="text-gray-300">• ${it.name || "Product"} × ${it.qty}</span>
                            <span class="font-bold text-emerald-400">${formatPrice(itemTotal)}</span>
                        </div>`;
                }).join("");

                const isCompleted = o.status === 'complete';

                return `
                    <div class="glass p-6 md:p-8 rounded-3xl space-y-6 hover:border-yellow-400/30 transition shadow-xl">
                        <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 border-b border-white/10 pb-4">
                            <div>
                                <span class="text-xs text-yellow-400 font-bold uppercase tracking-wider">Order #${userOrders.length - idx}</span>
                                <h3 class="text-xl font-bold text-white mt-1">${o.customer.name || 'Customer'}</h3>
                                <p class="text-xs text-gray-400"><i class="fa-regular fa-clock"></i> ${o.date || 'Recent'}</p>
                            </div>
                            <div class="text-left md:text-right">
                                <span class="text-xs text-gray-400 block">Total Amount</span>
                                <span class="text-2xl font-black text-emerald-400">${formatPrice(o.total || 0)}</span>
                            </div>
                        </div>

                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div>
                                <h4 class="font-bold text-sm text-gray-300 mb-2">Ordered Items:</h4>
                                <div class="space-y-1">${itemsList}</div>
                            </div>

                            <div class="space-y-3 bg-white/5 p-4 rounded-2xl border border-white/5">
                                <div>
                                    <span class="text-xs text-gray-400 block">Order Status</span>
                                    <span class="inline-flex items-center gap-2 text-sm font-bold mt-1 ${isCompleted ? 'text-emerald-400' : 'text-amber-400'}">
                                        <i class="fa-solid ${isCompleted ? 'fa-circle-check' : 'fa-hourglass-half'}"></i>
                                        ${isCompleted ? 'Delivered' : 'Pending Processing'}
                                    </span>
                                </div>

                                <div>
                                    <span class="text-xs text-gray-400 block">Tracking Number</span>
                                    ${
                                        o.tracking_id 
                                        ? `<button onclick="copyToClipboard('${o.tracking_id}')" class="text-cyan-400 font-mono font-bold text-sm hover:underline flex items-center gap-2 mt-1">
                                                <i class="fa-regular fa-copy"></i> ${o.tracking_id}
                                           </button>`
                                        : `<span class="text-gray-500 text-xs italic">Not assigned yet</span>`
                                    }
                                </div>
                            </div>
                        </div>

                        <div class="pt-4 border-t border-white/10 flex justify-between items-center text-xs text-gray-400">
                            <span>Need help with this order?</span>
                            <a href="https://wa.me/923001234567" target="_blank" class="text-emerald-400 font-bold hover:underline flex items-center gap-1">
                                <i class="fa-brands fa-whatsapp"></i> Contact Support
                            </a>
                        </div>
                    </div>
                `;
            }).join("");
        }

        function copyToClipboard(text) {
            navigator.clipboard.writeText(text);
            alert("📋 Tracking ID copied to clipboard!");
        }

        document.getElementById("phoneInput").addEventListener("keyup", function(e) {
            if (e.key === "Enter") checkOrders();
        });

        document.addEventListener("DOMContentLoaded", () => {
            updateBadges();
        });
    </script>
</body>

</html>
