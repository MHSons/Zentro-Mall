---

## Key Features & Structure

### 1. Header & Navigation (`<nav>`)
* **Responsive Navbar:** Features responsive layouts for desktop and mobile devices using Tailwind classes (`hidden lg:flex`, `lg:hidden`).
* **Glassmorphism Design:** Styled with custom background translucency and backdrop filters (`.glass`).
* **Interactive Counters:** Includes dynamic badge counters for `Wishlist` and `Cart` items.

---

### 2. Main Product Container (`<main>`)
* **Skeleton Loading:** Displays animated placeholder skeletons (`animate-pulse`) while product details load via JavaScript.
* **Dynamic Content Injection:**
  * Extracts the product `id` parameter from URL query strings (`window.location.search`).
  * Searches the global `products` array (loaded via `main.js`).
  * If found, renders:
    * **Media Display:** Handles both image (`<img>`) and video (`<video>`) media types with automatic fallbacks.
    * **Wishlist Toggle:** Heart button to add/remove the item from local wishlist state.
    * **Product Info:** Display name, category badge, detailed description, and price formatted with `formatPrice()`.
    * **Quantity Controls:** Dynamic `+` and `-` quantity selectors.
    * **Action Buttons:** "Add to Cart" and "Buy Now" (redirects directly to `checkout.html`).
    * **Social Sharing:** WhatsApp share trigger.
  * **Fallback Error State:** If the product ID is invalid or missing, it shows a "Product Not Found" card with a button to return to catalog browsing.

---

### 3. Features & Logic (`<script>`)
* **Recently Viewed Items:** Saves up to 10 recently viewed product IDs to local storage (`localStorage.setItem("zm_viewed", ...)`).
* **Related Products:** Filters and displays up to 4 items matching the current product's category.
